name: Prepare reviewed Motion release
on:
  push:
    tags: ['motion-*']
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/motion-build.yml
    with:
      ref: ${{ github.ref }}
  draft:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Collect tested artifacts and create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh run download $env:RUN_ID --name motion-windows-x64 --dir release-assets --repo $env:REPOSITORY
          if ($LASTEXITCODE) { throw 'Cannot download tested build artifacts' }
          $assets = @(Get-ChildItem release-assets -File | Where-Object { $_.Extension -in @('.7z','.zip','.json') } | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --draft --title ('FMD2 Motion '+$env:RELEASE_TAG) --notes-file motion/CHANGELOG.md --repo $env:REPOSITORY
          if ($LASTEXITCODE) { throw 'Cannot prepare the release draft' }
