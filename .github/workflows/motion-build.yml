name: Motion Windows build and offline tests
on:
  push:
    branches-ignore: ['automation/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Fetch verified toolchain and pinned dependencies
        run: ./motion/scripts/Bootstrap.ps1
      - name: Generate neutral motion fixtures
        run: |
          python -m pip install Pillow==13.0.0 imageio-ffmpeg==0.6.0
          if ($LASTEXITCODE) { throw 'Test dependency installation failed' }
          python motion/tests/generate-fixtures.py
          if ($LASTEXITCODE) { throw 'Fixture generation failed' }
      - name: Compile FMD2, updater and native regression tests
        run: ./motion/scripts/Build.ps1
      - name: Test clean and conflicting upstream merges
        run: ./motion/tests/sync-tests.ps1
      - name: Test reader with browser network disabled
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.motion-build/browsers
        run: |
          npm install --prefix motion/tests --no-save --package-lock=false playwright@1.62.1
          if ($LASTEXITCODE) { throw 'Playwright installation failed' }
          node motion/tests/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE) { throw 'Browser installation failed' }
          node motion/tests/browser-tests.cjs
          if ($LASTEXITCODE) { throw 'Offline browser tests failed' }
      - name: Package tested portable build
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $tag = if ($env:REF_TYPE -eq 'tag') { $env:RELEASE_REF } else { 'ci-' + (git rev-parse --short HEAD) }
          ./motion/scripts/Package.ps1 -Destination .motion-build/package -Repository $env:REPOSITORY -ReleaseTag $tag
      - name: Export corresponding source and dependency sources
        run: ./motion/scripts/Export-Source.ps1 -Destination .motion-build/fmd-motion-source
      - name: Upload builds and evidence
        # Source includes the exact pinned dependency sources, not just links.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motion-windows-x64
          path: |
            .motion-build/*.log
            .motion-build/*.7z
            .motion-build/*.zip
            .motion-build/motion-latest.json
            .motion-build/browser-results/
            .motion-build/sync-tests/
          if-no-files-found: error
